name: Deploy to AlwaysData

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies and build
        run: |
          npm ci
          npx tsc
          npx prisma generate

      - name: Pack production node_modules
        run: |
          rm -rf node_modules
          npm ci --omit=dev
          tar czf node_modules.tar.gz node_modules

      - name: Deploy files via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALWAYSDATA_SSH_HOST }}
          username: ${{ secrets.ALWAYSDATA_SSH_USER }}
          password: ${{ secrets.ALWAYSDATA_SSH_PASSWORD }}
          source: "dist/,node_modules.tar.gz,prisma/"
          target: "~/app/"
          overwrite: true

      - name: Extract and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ALWAYSDATA_SSH_HOST }}
          username: ${{ secrets.ALWAYSDATA_SSH_USER }}
          password: ${{ secrets.ALWAYSDATA_SSH_PASSWORD }}
          script: |
            cd ~/app
            tar xzf node_modules.tar.gz
            rm node_modules.tar.gz
            git fetch origin main
            git reset --hard origin/main
            npx prisma migrate deploy
